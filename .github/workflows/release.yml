# Publishes to PyPI when a GitHub release is published.
#
# CI runs first and gates the publish: a PyPI upload cannot be undone, so
# nothing ships that the matrix has not proven.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: no API token stored in the repo.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install just
        uses: extractions/setup-just@v4

      # The tag is what humans read; __init__.py is what pip installs. A
      # mismatch ships a version nobody can reproduce from the tag.
      - name: Verify tag matches package version
        run: |
          pkg_version=$(uv run python -c "from switrs_to_sqlite import __version__; print(__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "ERROR: tag ($tag_version) does not match __version__ ($pkg_version)"
            exit 1
          fi

      - name: Build package
        run: just build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
